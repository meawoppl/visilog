[package]
name = "visilog"
version = "0.2.0"
edition = "2021"

[dependencies]
nom = "7.1.3"
git2 = "0.13.24"
lazy_static = "1.4.0"
rand = "0.8.5"
strum = {version="0.26.3", features = ["strum_macros"]}
strum_macros = "0.26.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false
